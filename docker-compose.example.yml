services:
  # Laravel PHP-FPM Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    container_name: nita-store-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - path: .env
        required: false
      - path: .env.docker
        required: false
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    networks:
      - global-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Nginx Web Server Service
  web:
    image: nginx:alpine
    container_name: nita-store-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - global-network
    depends_on:
      - app

  # Laravel Queue Worker (Opsional / Background Job)
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    container_name: nita-store-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --timeout=90
    env_file:
      - path: .env
        required: false
      - path: .env.docker
        required: false
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    networks:
      - global-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app

networks:
  global-network:
    external: true
